<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>FandiBattleRoyale</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOBBY -->
<div id="lobby">
  <div class="top-bar">
    <div>👤 Fandi | Lv <span id="level">1</span></div>
    <div>💰 <span id="coin">1000</span> 💎 <span id="diamond">50</span></div>
  </div>

  <canvas id="charCanvas"></canvas>

  <div class="menu">
    <button onclick="openMenu('shop')">Shop</button>
    <button onclick="openMenu('vault')">Vault</button>
    <button onclick="openMenu('weapon')">Senjata</button>
    <button onclick="openMenu('topup')">Top Up</button>
    <button onclick="openMenu('dev')">Developer</button>
    <button class="start" onclick="startGame()">START</button>
  </div>
</div>

<!-- HUD GAME -->
<div id="hud">
  <div id="hpBar"><div id="hp"></div></div>
  <div id="info">Lv <span id="gLevel"></span> | 💰 <span id="gCoin"></span></div>
  <div id="zone">SAFE ZONE</div>

  <div id="joystick"></div>
  <button id="shoot">🔫</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.152/build/three.min.js"></script>
<script src="libs/GLTFLoader.js"></script>

<script src="storage.js"></script>
<script src="lobby.js"></script>
<script src="game.js"></script>
<script src="ui.js"></script>
<script src="main.js"></script>
</body>
                                                 </html>
